<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리의 세기와 높이 보기</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --fg:#111827; --muted:#6b7280; --border:#d1d5db; --loud:#f97316; --pitch:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:900px; margin:0 auto; padding:12px 14px 24px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  h1 { font-size:20px; margin:0; flex:1; }
  button { font-size:16px; padding:10px 18px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; }
  button.primary { background:#111827; color:#fff; border-color:#111827; }
  button:disabled { opacity:.5; cursor:default; }
  #status { font-size:13px; color:var(--muted); }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .card .label { font-size:14px; color:var(--muted); }
  .card .value { font-size:38px; font-weight:800; line-height:1.2; margin-top:4px; }
  .card.loud .value { color:var(--loud); }
  .card.pitch .value { color:var(--pitch); }
  .card .sub { font-size:14px; color:var(--muted); min-height:18px; }
  .stage { display:grid; grid-template-columns:70px 1fr 70px; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; height:360px; }
  .gauge { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .gtitle { font-size:14px; font-weight:700; }
  .gbox { position:relative; flex:1; width:36px; border:2px solid var(--border); border-radius:8px; background:#fff; overflow:hidden; }
  .gfill { position:absolute; left:0; right:0; bottom:0; height:0%; background:var(--loud); transition:height .05s linear; }
  .gmarker { position:absolute; left:-2px; right:-2px; height:10px; bottom:0; background:var(--pitch); border-radius:4px; transition:bottom .05s linear; }
  .gticks { position:absolute; inset:0; pointer-events:none; }
  .gticks div { position:absolute; left:0; right:0; border-top:1px dashed #cbd5e1; }
  .glabels { display:flex; flex-direction:column; justify-content:space-between; font-size:11px; color:var(--muted); height:100%; }
  canvas { display:block; width:100%; height:100%; }
  #ballWrap { position:relative; }
  .hist { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-top:10px; }
  .hist .label { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .hist canvas { height:150px; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; margin-top:10px; }
  .ctl { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:14px; }
  .ctl label { display:flex; justify-content:space-between; margin-bottom:4px; }
  .ctl input[type=range] { width:100%; }
  .ctl .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hint { font-size:13px; color:var(--muted); margin-top:12px; line-height:1.5; }
  @media (max-width:600px) {
    .card .value { font-size:30px; }
    .stage { height:300px; grid-template-columns:56px 1fr 56px; }
    .gbox { width:28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>소리의 세기와 높이 보기</h1>
    <button id="startBtn" class="primary">마이크 켜기</button>
    <span id="status"></span>
  </header>

  <section class="cards">
    <div class="card loud">
      <div class="label">세기 (크고 작음)</div>
      <div class="value" id="loudText">—</div>
      <div class="sub">공이 <b>커질수록</b> 센 소리</div>
    </div>
    <div class="card pitch">
      <div class="label">높이 (높고 낮음)</div>
      <div class="value" id="pitchText">—</div>
      <div class="sub" id="noteText">공이 <b>올라갈수록</b> 높은 소리</div>
    </div>
  </section>

  <section class="stage">
    <div class="gauge">
      <div class="gtitle" style="color:var(--loud)">세기</div>
      <div class="gbox">
        <div class="gfill" id="loudFill"></div>
        <div class="gticks"><div style="top:20%"></div><div style="top:40%"></div><div style="top:60%"></div><div style="top:80%"></div></div>
      </div>
    </div>
    <div id="ballWrap"><canvas id="ball"></canvas></div>
    <div class="gauge">
      <div class="gtitle" style="color:var(--pitch)">높이</div>
      <div class="gbox">
        <div class="gticks"><div style="top:20%"></div><div style="top:40%"></div><div style="top:60%"></div><div style="top:80%"></div></div>
        <div class="gmarker" id="pitchMarker"></div>
      </div>
    </div>
  </section>

  <section class="hist">
    <div class="label">지나간 8초 동안의 소리 (공의 크기 = 세기, 공의 높이 = 높이)</div>
    <canvas id="history"></canvas>
  </section>

  <section class="controls">
    <div class="ctl">
      <label><span>반응 속도</span><span id="speedLabel">보통</span></label>
      <input type="range" id="speed" min="0" max="4" step="1" value="2">
    </div>
    <div class="ctl">
      <label><span>마이크 감도</span><span id="sensLabel">보통 (0 dB)</span></label>
      <input type="range" id="sens" min="-12" max="18" step="1" value="0">
    </div>
    <div class="ctl">
      <div class="row">
        <button id="calBtn">큰 소리 기준 맞추기</button>
        <button id="resetBtn">기본값</button>
        <span id="calInfo" style="color:var(--muted);font-size:13px"></span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">누른 뒤 3초 동안 가장 크게 "아~" 하면, 그 소리가 "아주 크게"가 됩니다.</div>
    </div>
    <div class="ctl">
      <label><input type="checkbox" id="noteChk"> 계이름 보기</label>
    </div>
  </section>

  <p class="hint">기기에서 20~30cm 떨어져 "아~" 하고 소리 내 보세요. 작게/크게, 낮게/높게를 따로따로 바꿔 보세요.<br>
  박수나 책상 두드리기처럼 음높이가 없는 소리는 세기만 나오고 높이는 "높이 없음"으로 표시됩니다.</p>
</div>

<script>
(function () {
  // ---------- 세기(크기) 설정 ----------
  // 사람이 기기 20~30cm 앞에서 내는 소리 기준. "아주 크게" 상한(dBFS)과 표현 폭.
  var LOUD_RANGE = 36;          // 표현 폭(dB): 속삭임 ~ 크게 외침
  var DEFAULT_MAX_DB = -14;     // 이 값 이상이면 "아주 크게" 꽉 채움
  var maxDb = DEFAULT_MAX_DB;
  var sensDb = 0;               // 감도 슬라이더(+면 더 민감)
  var LOUD_STEPS = [0.15, 0.38, 0.62, 0.82];
  var LOUD_NAMES = ["아주 작게", "작게", "보통", "크게", "아주 크게"];

  // ---------- 높이 설정 ----------
  var F_MIN = 80, F_MAX = 1000; // 사람 목소리 범위(Hz), 로그 눈금
  var PITCH_STEPS = [0.2, 0.4, 0.6, 0.8];
  var PITCH_NAMES = ["아주 낮게", "낮게", "보통", "높게", "아주 높게"];
  var EVAL_MS = 100;            // 0.1초마다 평가
  var MEDIAN_N = 5;             // 최근 5회 중앙값

  // ---------- 반응 속도 ----------
  var SPEED_FACTORS = [0.5, 0.75, 1, 1.5, 2.2];
  var SPEED_NAMES = ["아주 느리게", "느리게", "보통", "빠르게", "아주 빠르게"];
  var speedFactor = 1;
  var ATTACK_S = 0.12, RELEASE_S = 0.35;

  // ---------- 상태 ----------
  var audioCtx = null, analyser = null, buf = null, running = false;
  var loudLevel = 0;            // 0~1 (부드럽게 처리된 값)
  var curDb = -100;
  var pitchHist = [];           // 최근 유효 주파수들
  var pitchPos = 0.45;          // 0~1 (표시용, 부드럽게)
  var pitchTargetPos = -1;      // -1 = 높이 없음
  var lastValidFreq = -1;
  var hasPitch = false;
  var lastEval = 0;
  var history = [];             // {t, level, pos}
  var calibrating = false, calEnd = 0, calPeak = -100;
  var lastFrame = 0;

  var $ = function (id) { return document.getElementById(id); };
  var startBtn = $("startBtn"), statusEl = $("status");
  var loudText = $("loudText"), pitchText = $("pitchText"), noteText = $("noteText");
  var loudFill = $("loudFill"), pitchMarker = $("pitchMarker");
  var ballCv = $("ball"), histCv = $("history");
  var ballCtx = ballCv.getContext("2d"), histCtx = histCv.getContext("2d");

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function dbToLevel(db) {
    var top = maxDb - sensDb;
    var bottom = top - LOUD_RANGE;
    return clamp((db - bottom) / LOUD_RANGE, 0, 1);
  }
  function freqToPos(f) {
    return clamp(Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN), 0, 1);
  }
  function stepName(v, steps, names) {
    for (var i = 0; i < steps.length; i++) { if (v < steps[i]) return names[i]; }
    return names[names.length - 1];
  }
  function noteName(f) {
    var names = ["도", "도#", "레", "레#", "미", "파", "파#", "솔", "솔#", "라", "라#", "시"];
    var n = Math.round(12 * Math.log(f / 440) / Math.log(2)) + 69;
    var oct = Math.floor(n / 12) - 1;
    return names[n % 12] + oct + " (" + Math.round(f) + "Hz)";
  }

  // ---------- 캔버스 크기 ----------
  function fitCanvas(cv) {
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) {
      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
    }
    return { w: r.width, h: r.height, dpr: dpr };
  }

  // ---------- 음높이 검출(자기상관) ----------
  function detectPitch(data, sr) {
    var n = data.length;
    var minLag = Math.floor(sr / F_MAX);
    var maxLag = Math.min(Math.ceil(sr / F_MIN), Math.floor(n / 2));
    var corr = new Float32Array(maxLag + 1);
    var best = 0;
    for (var lag = minLag; lag <= maxLag; lag++) {
      var num = 0, d1 = 0, d2 = 0;
      for (var i = 0; i < n - lag; i++) {
        var a = data[i], b = data[i + lag];
        num += a * b; d1 += a * a; d2 += b * b;
      }
      var c = num / Math.sqrt(d1 * d2 + 1e-12);
      corr[lag] = c;
      if (c > best) best = c;
    }
    if (best < 0.6) return -1;
    var thr = best * 0.85;
    // 첫 번째로 임계값을 넘는 봉우리(옥타브 오류 방지)
    for (var l = minLag + 1; l < maxLag; l++) {
      if (corr[l] > thr && corr[l] >= corr[l - 1] && corr[l] >= corr[l + 1]) {
        var y0 = corr[l - 1], y1 = corr[l], y2 = corr[l + 1];
        var denom = (y0 - 2 * y1 + y2);
        var shift = denom === 0 ? 0 : 0.5 * (y0 - y2) / denom;
        var f = sr / (l + shift);
        if (f < F_MIN || f > F_MAX) return -1;
        return f;
      }
    }
    return -1;
  }
  function median(arr) {
    var s = arr.slice().sort(function (a, b) { return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // ---------- 메인 루프 ----------
  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);
    var dt = lastFrame ? Math.min((ts - lastFrame) / 1000, 0.1) : 0.016;
    lastFrame = ts;

    analyser.getFloatTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    var rms = Math.sqrt(sum / buf.length);
    curDb = 20 * Math.log10(Math.max(rms, 1e-6));

    // 세기: 커질 땐 빠르게, 작아질 땐 천천히
    var target = dbToLevel(curDb);
    var tau = (target > loudLevel ? ATTACK_S : RELEASE_S) / speedFactor;
    var k = 1 - Math.exp(-dt / tau);
    loudLevel += (target - loudLevel) * k;

    // 보정 중이면 최대값 기록
    if (calibrating) {
      if (curDb > calPeak) calPeak = curDb;
      var remain = Math.max(0, Math.ceil((calEnd - ts) / 1000));
      $("calInfo").textContent = "크게 소리 내세요! " + remain + "초";
      if (ts >= calEnd) finishCalibration();
    }

    // 높이: 0.1초마다 평가, 최근 5회 중앙값
    if (ts - lastEval >= EVAL_MS / Math.sqrt(speedFactor)) {
      lastEval = ts;
      var gate = target > 0.06;
      var f = gate ? detectPitch(buf, audioCtx.sampleRate) : -1;
      pitchHist.push(f);
      if (pitchHist.length > MEDIAN_N) pitchHist.shift();
      var valid = pitchHist.filter(function (v) { return v > 0; });
      if (valid.length >= 3) {
        var mf = median(valid);
        lastValidFreq = mf;
        pitchTargetPos = freqToPos(mf);
        hasPitch = true;
      } else {
        hasPitch = false;
      }
      history.push({ t: ts, level: loudLevel, pos: hasPitch ? pitchTargetPos : -1 });
      while (history.length && ts - history[0].t > 8000) history.shift();
    }
    if (hasPitch) {
      var kp = 1 - Math.exp(-dt / (0.08 / speedFactor));
      pitchPos += (pitchTargetPos - pitchPos) * kp;
    }

    // ---------- 글자 표시 ----------
    var silent = loudLevel < 0.04;
    loudText.textContent = silent ? "소리 없음" : stepName(loudLevel, LOUD_STEPS, LOUD_NAMES);
    if (silent) {
      pitchText.textContent = "—";
      noteText.innerHTML = "공이 <b>올라갈수록</b> 높은 소리";
    } else if (hasPitch) {
      pitchText.textContent = stepName(pitchPos, PITCH_STEPS, PITCH_NAMES);
      noteText.textContent = $("noteChk").checked ? noteName(lastValidFreq) : "";
    } else {
      pitchText.textContent = "높이 없음";
      noteText.textContent = "";
    }

    // ---------- 게이지 ----------
    loudFill.style.height = (loudLevel * 100).toFixed(1) + "%";
    pitchMarker.style.bottom = "calc(" + (pitchPos * 100).toFixed(1) + "% - 5px)";
    pitchMarker.style.opacity = (hasPitch && !silent) ? "1" : "0.25";

    drawBall(silent);
    drawHistory(ts);
  }

  function drawBall(silent) {
    var s = fitCanvas(ballCv);
    var c = ballCtx;
    c.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    c.clearRect(0, 0, s.w, s.h);
    // 가로 안내선
    c.strokeStyle = "#e5e7eb"; c.lineWidth = 1;
    for (var i = 1; i < 5; i++) {
      var y = s.h * i / 5;
      c.beginPath(); c.moveTo(0, y); c.lineTo(s.w, y); c.stroke();
    }
    c.fillStyle = "#9ca3af"; c.font = "12px sans-serif"; c.textAlign = "left";
    c.fillText("높음", 6, 14);
    c.fillText("낮음", 6, s.h - 6);

    var margin = 30;
    var rMax = Math.min(s.w, s.h) * 0.42;
    var r = 10 + loudLevel * (rMax - 10);
    var y = s.h - margin - pitchPos * (s.h - 2 * margin);
    var x = s.w / 2;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    if (silent) { c.fillStyle = "rgba(156,163,175,0.35)"; }
    else if (hasPitch) { c.fillStyle = "rgba(37,99,235,0.85)"; }
    else { c.fillStyle = "rgba(107,114,128,0.6)"; }
    c.fill();
    c.strokeStyle = "rgba(249,115,22,0.95)"; c.lineWidth = 4 + loudLevel * 6;
    c.stroke();
  }

  function drawHistory(now) {
    var s = fitCanvas(histCv);
    var c = histCtx;
    c.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    c.clearRect(0, 0, s.w, s.h);
    c.strokeStyle = "#e5e7eb"; c.lineWidth = 1;
    for (var i = 1; i < 5; i++) {
      var y = s.h * i / 5;
      c.beginPath(); c.moveTo(0, y); c.lineTo(s.w, y); c.stroke();
    }
    var margin = 12;
    for (var j = 0; j < history.length; j++) {
      var h = history[j];
      var x = s.w * (1 - (now - h.t) / 8000);
      if (h.level < 0.04) continue;
      var r = 2 + h.level * 22;
      var yy = h.pos >= 0 ? s.h - margin - h.pos * (s.h - 2 * margin) : s.h - margin;
      c.beginPath();
      c.arc(x, yy, r, 0, Math.PI * 2);
      c.fillStyle = h.pos >= 0 ? "rgba(37,99,235,0.55)" : "rgba(107,114,128,0.4)";
      c.fill();
    }
  }

  // ---------- 보정 ----------
  function startCalibration() {
    if (!running) { statusEl.textContent = "먼저 마이크를 켜 주세요."; return; }
    calibrating = true;
    calPeak = -100;
    calEnd = performance.now() + 3000;
    $("calBtn").disabled = true;
  }
  function finishCalibration() {
    calibrating = false;
    $("calBtn").disabled = false;
    if (calPeak > -60) {
      maxDb = calPeak - 2;
      try { localStorage.setItem("soundviz_maxDb", String(maxDb)); } catch (e) {}
      $("calInfo").textContent = "맞춤 완료 (기준 " + maxDb.toFixed(0) + " dB)";
    } else {
      $("calInfo").textContent = "소리가 너무 작아 맞추지 못했어요.";
    }
  }
  function resetCalibration() {
    maxDb = DEFAULT_MAX_DB;
    try { localStorage.removeItem("soundviz_maxDb"); } catch (e) {}
    $("calInfo").textContent = "기본값으로 되돌렸어요.";
  }
  try {
    var saved = localStorage.getItem("soundviz_maxDb");
    if (saved !== null && !isNaN(parseFloat(saved))) {
      maxDb = parseFloat(saved);
      $("calInfo").textContent = "저장된 기준 사용 (" + maxDb.toFixed(0) + " dB)";
    }
  } catch (e) {}

  // ---------- 마이크 ----------
  function start() {
    if (running) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = "이 브라우저는 마이크를 지원하지 않아요. (https 주소에서 열어야 합니다)";
      return;
    }
    startBtn.disabled = true;
    statusEl.textContent = "마이크 권한을 허용해 주세요…";
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      video: false
    }).then(function (stream) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0;
      src.connect(analyser);
      buf = new Float32Array(analyser.fftSize);
      running = true;
      startBtn.textContent = "마이크 켜짐";
      statusEl.textContent = "";
      if (audioCtx.state === "suspended") audioCtx.resume();
      requestAnimationFrame(loop);
    }).catch(function (err) {
      startBtn.disabled = false;
      statusEl.textContent = "마이크를 열 수 없어요: " + (err && err.name ? err.name : err);
    });
  }

  // ---------- 컨트롤 ----------
  startBtn.addEventListener("click", start);
  $("calBtn").addEventListener("click", startCalibration);
  $("resetBtn").addEventListener("click", resetCalibration);
  $("speed").addEventListener("input", function (e) {
    var i = parseInt(e.target.value, 10);
    speedFactor = SPEED_FACTORS[i];
    $("speedLabel").textContent = SPEED_NAMES[i];
  });
  $("sens").addEventListener("input", function (e) {
    sensDb = parseInt(e.target.value, 10);
    var n = sensDb === 0 ? "보통" : (sensDb > 0 ? "더 민감" : "덜 민감");
    $("sensLabel").textContent = n + " (" + (sensDb > 0 ? "+" : "") + sensDb + " dB)";
  });
  window.addEventListener("resize", function () { fitCanvas(ballCv); fitCanvas(histCv); });
  fitCanvas(ballCv); fitCanvas(histCv);
  drawBall(true);
})();
</script>
</body>
</html>
